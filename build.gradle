plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '7.1.0'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = 'fr.hydroxios'
version = '1.0'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly("org.spigotmc:spigot-api:1.21.8-R0.1-SNAPSHOT")
    implementation 'com.github.twitch4j:twitch4j:1.16.0'
}

shadowJar {
    archiveClassifier.set('')
}

tasks.register("copyShadowJar", Copy) {
    dependsOn tasks.shadowJar
    from { tasks.shadowJar.archiveFile.get().asFile }
    into 'F:\\servers\\1.21.8\\plugins'
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21.8")
    }

    // Ensure shadowJar is built before runServer
    runServer.dependsOn shadowJar

    tasks.build.dependsOn tasks.copyShadowJar
}

def targetJavaVersion = 22
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
